services:
  postgres:
    image: postgres:16-alpine
    container_name: resource-allocation-mvp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: resource_verification
      POSTGRES_PASSWORD: resource_verification
      POSTGRES_DB: resource_verification
    ports:
      - "5433:5432"
    volumes:
      - resource_allocation_mvp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U resource_verification -d resource_verification"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  resource_allocation_mvp_pg_data:
